name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # 9.0.x is only needed by the multi-target fixture used by the end-to-end tests.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fast tests
        run: dotnet test --configuration Release

      - name: CRAP gate on this repository (the tool scores itself)
        run: |
          dotnet publish src/CrapSharp -c Release -o out
          dotnet out/CrapSharp.dll . --threshold 10

      - name: Duplication gate on the production sources
        run: npx --yes jscpd@5.4.2 src --format csharp --min-tokens 50 --min-lines 3 --threshold 0 --ignore "**/bin/**,**/obj/**"

      - name: End-to-end tests
        run: dotnet test --configuration Release --filter Category=EndToEnd --logger "trx;LogFileName=e2e.trx" --results-directory e2e-results
        env:
          CRAPSHARP_E2E: "1"

      # Shows how long each end-to-end test took as annotations of the run.
      - name: Report end-to-end durations
        if: always()
        shell: python
        run: |
          import glob, re
          import xml.etree.ElementTree as ET
          for trx in glob.glob("e2e-results/*.trx"):
              ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
              for r in ET.parse(trx).getroot().iterfind(".//t:UnitTestResult", ns):
                  print("::notice::%s %s %s" % (r.get("duration"), r.get("outcome"), r.get("testName")[-90:]))
